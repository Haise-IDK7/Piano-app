name: Release (.exe)
# Compila el instalador de Windows y lo publica en un GitHub Release.
# Se dispara al empujar un tag vX.Y.Z (o manualmente desde la pestaña Actions).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar instalador y portable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Leer versión
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: piano-app-windows
          path: release/*.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Piano App ${{ steps.v.outputs.version }}
          files: release/*.exe
          body: |
            **Descarga `Piano-App-Setup-${{ steps.v.outputs.version }}.exe`** (instalador) o `Piano-App-Portable-${{ steps.v.outputs.version }}.exe` (sin instalar).

            El ejecutable no está firmado: si Windows muestra «Windows protegió su PC», pulsa **Más información → Ejecutar de todas formas**.
